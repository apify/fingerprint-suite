name: Publish
on:
    release:
        types: [published]

permissions:
    contents: write
    id-token: write # Required for OIDC authentication.

jobs:
    test_and_sync:
        uses: ./.github/workflows/test-and-sync.yml
        secrets: inherit

    publish_latest:
        name: Publish latest
        runs-on: ubuntu-22.04
        needs: [test_and_sync]
        steps:
            - name: Checkout Source code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org/'
                  package-manager-cache: false

            - uses: apify/actions/pnpm-install@v1.6.2

            - name: Turbo cache
              id: turbo-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ github.job }}-${{ github.ref_name }}-

            - name: Release latest versions
              run: |
                  git config --global user.name 'Apify Release Bot'
                  git config --global user.email 'noreply@apify.com'

                  export GIT_TAG=$(echo $GITHUB_REF | sed 's/refs\/tags\///g')
                  pnpm release

            - name: Commit the version bump
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  branch: master
                  commit_message: 'chore: [skip ci] sync new package.json versions'
                  file_pattern: 'package*.json pnpm-lock.yaml'
                  commit_user_name: Apify Bot
                  commit_user_email: my-github-actions-bot@example.org
                  commit_author: Apify Bot <apify@apify.com>

    publish_to_pypi:
        name: Publish to PyPI
        needs: publish_latest # Publish only if publishing to JS worked.
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write # Required for OIDC authentication.
        environment:
            name: pypi
            url: https://pypi.org/project/crawlee
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: '3.14'
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
            - name: Build project
              shell: bash
              run: uv build

            # Publishes the package to PyPI using PyPA official GitHub action with OIDC authentication.
            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
