name: Publish
# Started by `release-published.yml`, so that it runs from master and can use the environment that holds the token.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish (e.g. v2.1.0)
                required: true
                type: string

permissions:
    contents: write
    id-token: write # Required for OIDC authentication.

jobs:
    test_and_sync:
        uses: apify/fingerprint-suite/.github/workflows/test-and-sync.yml@master
        secrets: inherit

    publish_latest:
        name: Publish latest
        runs-on: ubuntu-22.04
        needs: [test_and_sync]
        environment:
            name: npm
            deployment: false
        steps:
            # The tag's code runs with the token below, so it has to be code that already went through master.
            - name: Check that the tag is on master
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...refs/tags/${TAG}" --jq .status)
                  if [[ "$status" != "identical" && "$status" != "behind" ]]; then
                      echo "::error::${TAG} is not on master"
                      exit 1
                  fi

            - name: Checkout Source code
              uses: actions/checkout@v6.1.0
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Use Node.js
              uses: actions/setup-node@v6.5.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org/'

            - uses: apify/actions/pnpm-install@v1.1.2

            - name: Turbo cache
              id: turbo-cache
              uses: actions/cache@v5.1.0
              with:
                  path: .turbo
                  key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ github.job }}-${{ github.ref_name }}-

            - name: Release latest versions
              run: |
                  git config --global user.name 'Apify Release Bot'
                  git config --global user.email 'noreply@apify.com'

                  export GIT_TAG="$TAG"
                  pnpm release
              env:
                  TAG: ${{ inputs.tag }}

            - name: Commit the version bump
              uses: stefanzweifel/git-auto-commit-action@v7.2.0
              with:
                  branch: master
                  commit_message: 'chore: [skip ci] sync new package.json versions'
                  file_pattern: 'package*.json pnpm-lock.yaml'
                  commit_user_name: Apify Bot
                  commit_user_email: my-github-actions-bot@example.org
                  commit_author: Apify Bot <apify@apify.com>

    publish_to_pypi:
        name: Publish to PyPI
        needs: publish_latest # Publish only if publishing to JS worked.
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write # Required for OIDC authentication.
        environment:
            name: pypi
            url: https://pypi.org/project/crawlee
        steps:
            - uses: actions/checkout@v6.1.0
              with:
                  ref: refs/tags/${{ inputs.tag }}
            - uses: actions/setup-python@v6.3.0
              with:
                  python-version: '3.14'
            - uses: astral-sh/setup-uv@v7.6.0
            - name: Build project
              shell: bash
              run: uv build

            # Publishes the package to PyPI using PyPA official GitHub action with OIDC authentication.
            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
