name: Run tests

on:
    # Push to master will deploy a dev version, push to stable deploys the latest version (and syncs the master branch)
    push:
        branches: [master, stable, v3]
    # PRs will run tests (skip deployment)
    pull_request:
        branches: [master, stable, v3]
    # A release via GitHub releases will deploy the latest version
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

env:
    APIFY_HTTPBIN_TOKEN: ${{ secrets.APIFY_HTTPBIN_TOKEN }}

jobs:
    lint:
        name: Lint
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js 24
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - uses: apify/actions/pnpm-install@v1.6.2

            - run: pnpm lint

            - run: pnpm format:check

    build_and_test:
        name: Build & Test
        needs: [lint]
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-22.04]
                node-version: [22, 24, 26]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  package-manager-cache: false

            - uses: apify/actions/pnpm-install@v1.6.2

            - name: Install Playwright deps
              run: pnpm exec playwright install --with-deps

            - name: Install Puppeteer deps
              run: |
                  pnpm exec puppeteer browsers install chrome
                  pnpm exec puppeteer browsers install firefox

            - name: Turbo cache
              id: turbo-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ github.job }}-${{ github.ref_name }}-

            - name: Build
              run: pnpm build

            - name: Type-check the tests
              run: pnpm tsc-check-tests

            - name: Run Windows or MacOs tests
              run: pnpm test
              if: ${{ matrix.os == 'windows-latest' || matrix.os == 'macos-latest' }}

            - name: Run Linux tests
              run: xvfb-run --auto-servernum -- pnpm test
              if: ${{ matrix.os == 'ubuntu-22.04'}}
