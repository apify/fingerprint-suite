packages:
  - packages/*

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@apify/*'
  - '@crawlee/*'
  - 'apify-client'
  - 'apify'
  - 'crawlee'
  - 'got-scraping'

allowBuilds:
  '@swc/core': true
  esbuild: true
  playwright: true
  playwright-core: true
  puppeteer: true

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '*'
